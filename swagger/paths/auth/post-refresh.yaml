tags:
  - Auth
summary: Refresh user session
operationId: refreshSession
description: 'Refreshes access token using refresh token from cookies'
security: []
responses:
  '200':
    description: Successfully refreshed session
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: 'newAccessToken123...'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
